# EduRepo – Docker Compose
# --------------------------------------------------------------------------
# Diese Datei ist PRODUKTIONSREIF: Backend & Frontend laufen als komplett
# gebaute Images (kein Quellcode-Mount nötig!). Es genügt, das Repo (oder die
# Images) auf den Server zu kopieren und `docker compose up -d --build` –
# fehlende Quellordner führen nicht mehr zu leeren /app-Verzeichnissen.
#
# FÜR ENTWICKLUNG (Hot-Reload, Volume-Mounts) stattdessen starten:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Start:        docker compose up -d --build
# Logs:         docker compose logs -f backend frontend
# Stop:         docker compose down
# Reset (DB):   docker compose down -v && docker compose up -d --build
# Siehe auch:   docs/RUNNING.md
# --------------------------------------------------------------------------
name: edurepo

services:
  # ------------------------------------------------------------------ Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edurepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurepo-secret}
      POSTGRES_DB: ${POSTGRES_DB:-edurepo}
    volumes:
      # Persistente Daten ausserhalb des Workspace (ueberlebt Workspace-Updates):
      - ${EDUREPO_DATA_DIR:-./docker-data}/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edurepo} -d ${POSTGRES_DB:-edurepo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${EDUREPO_DATA_DIR:-./docker-data}/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ MinIO (S3)
  # Hinweis: Neuere MinIO-Releases benoetigen x86-64-v2 CPUs. Auf aelteren
  # KVM/vCPU-Hosts (nur SSE2) ist der letzte kompatible Release vom 2022-10-24
  # zu verwenden – via MINIO_IMAGE ueberschreibbar.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2022-10-24T18-35-07Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edurepo-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edurepo-minio-secret}
    volumes:
      - ${EDUREPO_DATA_DIR:-./docker-data}/minio:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------- MinIO: Bucket auto-create
  minio-init:
    # Auch hier: aelterer Release fuer x86-64-v1 CPUs (siehe MinIO-Kommentar oben)
    image: ${MC_IMAGE:-minio/mc:RELEASE.2023-01-11T03-14-16Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-edurepo-minio} ${MINIO_ROOT_PASSWORD:-edurepo-minio-secret};
      mc mb --ignore-existing local/${S3_BUCKET:-edurepo-files} || true;
      mc anonymous set none local/${S3_BUCKET:-edurepo-files} || true;
      echo 'Bucket ready: ${S3_BUCKET:-edurepo-files}';
      exit 0;
      "
    restart: "no"

  # ------------------------------------------------------------------ Backend
  # Produktions-Image (Multi-Stage-Build): enthaelt Code, Schema, Prisma-Client
  # und Seed – KEIN Mount des Quellcodes. Der Entrypoint wendet das DB-Schema
  # an (migrate deploy bzw. db push), seet und startet node dist/src/main.js.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # DB
      DATABASE_URL: ${DATABASE_URL}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_SECRET: ${APP_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Storage
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-edurepo-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      # Upload
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-104857600}
      # Mail
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # OAuth
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      BACKEND_PUBLIC_URL: ${API_BASE_URL:-http://localhost:4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      # Bootstrap
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@edurepo.local}
    ports:
      - "4000:4000"

  # ------------------------------------------------------------------ Frontend
  # Produktions-Image (Multi-Stage-Build): next build (standalone) + node server.js.
  # NEXT_PUBLIC_*-Variablen werden beim Build eingebrannt → Build-Args.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Browser nutzt same-origin /api/*-Proxy (Rewrite in next.config.mjs).
      # NEXT_PUBLIC_API_URL nur setzen, wenn der Browser das Backend DIREKT
      # erreichen soll (dann Mixed-Content/CORS beachten!):
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      # Vom Server-Container genutzte interne API-URL (SSR + Rewrite-Target):
      API_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"